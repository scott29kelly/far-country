<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Far Country</title>
    <style>
      :root {
        /* night sky tinted toward the city's gold; never pure black */
        --night: #0c0f17;
        --night-lift: #131728;
        --gold: #d9a441;
        --gold-line: #e0b45c;
        --gold-dim: #8a6c33;
        --crystal: #dfeaf0;
        --parchment: #d8cfbc;
        --parchment-dim: #9b917d;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--night);
        font-family: var(--serif);
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ============ boot rite: "coming down out of heaven from God" ============ */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        background:
          radial-gradient(130% 100% at 50% 116%, rgba(217, 164, 65, 0.09), transparent 55%),
          radial-gradient(150% 125% at 50% 42%, var(--night-lift) 0%, var(--night) 60%, #07090f 100%);
        transition: opacity 1.05s ease;
        cursor: default;
      }
      /* the scene canvas: layered matte backdrop (vendored stills) with the
         descending city, plus light motes — falls back to the hand-painted
         night whenever the stills can't load */
      #boot-scene {
        position: absolute;
        inset: 0;
        display: block;
      }
      /* glory veil — the staged dissolve's "eyes adjusting" exposure ramp */
      #boot-veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(90% 75% at 50% 56%,
          rgba(255, 246, 222, 0.98) 0%,
          rgba(244, 214, 138, 0.85) 34%,
          rgba(217, 164, 65, 0.42) 62%,
          rgba(217, 164, 65, 0.12) 100%);
        opacity: 0;
        transition: opacity 0.7s ease-in;
        pointer-events: none;
      }

      /* progress — a single quiet gold line (the gem row is gone, 2026-07-20) */
      #boot-rite {
        position: absolute;
        left: 50%;
        top: 76%;
        transform: translateX(-50%);
        width: min(380px, 56vw);
        pointer-events: none;
      }
      #boot-baseline {
        position: relative;
        height: 1px;
        background: rgba(217, 164, 65, 0.18);
      }
      #boot-baseline > div {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: rgba(224, 180, 92, 0.75);
        transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* the word — Scripture with citation, held high in the sky */
      #boot-word {
        position: absolute;
        left: 50%;
        top: 11%;
        transform: translateX(-50%);
        width: min(820px, 88vw);
        text-align: center;
        pointer-events: none;
      }
      #boot-verse {
        font-style: italic;
        font-size: clamp(20px, 2.9vw, 30px);
        line-height: 1.55;
        color: var(--parchment);
        opacity: 0;
        transition: opacity 1.1s ease;
        text-shadow: 0 1px 6px rgba(7, 9, 15, 0.55), 0 2px 26px rgba(7, 9, 15, 0.75);
      }
      #boot-cite {
        margin-top: 13px;
        font-style: normal;
        font-size: clamp(11px, 1.1vw, 13px);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        /* deep bronze + firm shadow: must stay legible when the city's white
           crown rises behind it at rest */
        color: #7a5e2c;
        opacity: 0;
        transition: opacity 1.1s ease;
        text-shadow: 0 1px 3px rgba(255, 244, 214, 0.55), 0 1px 12px rgba(7, 9, 15, 0.35);
      }

      /* functional frame: corners */
      #boot-mark {
        position: absolute;
        top: clamp(18px, 3.4vh, 34px);
        left: clamp(20px, 3.2vw, 40px);
        pointer-events: none;
      }
      #boot-mark .name {
        font-size: clamp(15px, 1.5vw, 18px);
        letter-spacing: 0.34em;
        color: var(--parchment);
      }
      #boot-mark .sub {
        margin-top: 7px;
        font-size: 9.5px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--gold-dim);
      }
      #boot-status {
        position: absolute;
        bottom: clamp(16px, 3vh, 30px);
        left: clamp(20px, 3.2vw, 40px);
        pointer-events: none;
      }
      #boot-stage {
        font-size: 12.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--parchment-dim);
        transition: opacity 0.3s ease;
      }
      #boot-msg {
        margin-top: 6px;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: rgba(155, 145, 125, 0.42);
      }
      #boot-hint {
        position: absolute;
        bottom: clamp(16px, 3vh, 30px);
        right: clamp(20px, 3.2vw, 40px);
        font-size: 10px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(155, 145, 125, 0.4);
        pointer-events: none;
        opacity: 0;
        transition: opacity 2s ease;
      }

      /* staged dissolve: text furniture bows out first, then the veil, then the night */
      #boot.leaving #boot-word,
      #boot.leaving #boot-mark,
      #boot.leaving #boot-status,
      #boot.leaving #boot-hint,
      #boot.leaving #boot-rite {
        opacity: 0 !important;
        transition: opacity 0.5s ease !important;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot * { transition-duration: 0.01s !important; }
        #boot { transition-duration: 0.2s !important; }
      }
    </style>
    <script type="module" crossorigin src="/laas/assets/index-BD1WP0O8.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <!-- the descent, painted every frame by BootUI (Canvas2D, zero assets) -->
      <canvas id="boot-scene"></canvas>
      <div id="boot-veil"></div>

      <div id="boot-rite">
        <div id="boot-baseline"><div id="boot-baseline-fill"></div></div>
      </div>

      <div id="boot-word">
        <div id="boot-verse"></div>
        <div id="boot-cite"></div>
      </div>

      <div id="boot-mark">
        <div class="name">FAR&nbsp;COUNTRY</div>
        <div class="sub">The New Jerusalem</div>
      </div>

      <div id="boot-status">
        <div id="boot-stage">kindling the light</div>
        <div id="boot-msg">initializing</div>
      </div>

      <div id="boot-hint">the light follows your lamp</div>
    </div>
  </body>
</html>
