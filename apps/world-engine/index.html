<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Far Country</title>
    <style>
      :root {
        /* night sky tinted toward the city's gold; never pure black */
        --night: #0c0f17;
        --night-lift: #131728;
        --gold: #d9a441;
        --gold-line: #e0b45c;
        --gold-dim: #8a6c33;
        --crystal: #dfeaf0;
        --parchment: #d8cfbc;
        --parchment-dim: #9b917d;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--night);
        font-family: var(--serif);
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ============ boot rite: "The Arrival" ============
         Full-bleed stills of the real world (ADR 0019) carried by
         compositor-driven motion (CSS transform/opacity keep easing even
         while world-gen stalls the main thread), under the word and the
         twelve foundation stones. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        background:
          radial-gradient(120% 90% at 50% 118%, rgba(217, 164, 65, 0.10), transparent 55%),
          radial-gradient(140% 120% at 50% 50%, var(--night-lift) 0%, var(--night) 62%, #080a10 100%);
        transition: opacity 1.8s ease;
        cursor: default;
      }
      /* tooling / reduced-motion hide path — must be gone well under 1 s */
      #boot.fast {
        transition-duration: 0.3s;
      }

      #boot-stills {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #boot-stills .still {
        position: absolute;
        inset: -7%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 2.6s ease;
        will-change: transform, opacity;
      }
      #boot-stills .still.on {
        opacity: 1;
      }
      .kbA {
        animation: kbA 30s ease-in-out infinite alternate;
      }
      .kbB {
        animation: kbB 34s ease-in-out infinite alternate;
      }
      @keyframes kbA {
        from { transform: scale(1) translate(0, 0); }
        to { transform: scale(1.07) translate(1.4%, -1%); }
      }
      @keyframes kbB {
        from { transform: scale(1.06) translate(-1.2%, 0.8%); }
        to { transform: scale(1) translate(0, 0); }
      }
      /* the arrival freezes the journey where it stands */
      #boot.arriving #boot-stills .still {
        animation-play-state: paused;
      }

      /* legibility scrim over the stills, heavier toward the word */
      #boot-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to top, rgba(5, 7, 12, 0.86) 0%, rgba(5, 7, 12, 0.34) 22%, transparent 46%),
          linear-gradient(to bottom, rgba(5, 7, 12, 0.55) 0%, transparent 22%);
        pointer-events: none;
      }

      /* functional frame: title mark */
      #boot-mark {
        position: absolute;
        top: clamp(18px, 3.4vh, 34px);
        left: clamp(20px, 3.2vw, 40px);
        pointer-events: none;
      }
      #boot-mark .name {
        font-size: clamp(15px, 1.5vw, 18px);
        letter-spacing: 0.34em;
        color: var(--parchment);
      }
      #boot-mark .sub {
        margin-top: 7px;
        font-size: 9.5px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--gold-dim);
      }

      /* the word — Scripture with citation, lower third */
      #boot-word {
        position: absolute;
        left: 50%;
        bottom: 17%;
        transform: translateX(-50%);
        width: min(620px, 84vw);
        text-align: center;
        pointer-events: none;
      }
      #boot-verse {
        font-style: italic;
        font-size: clamp(15px, 2vw, 20px);
        line-height: 1.65;
        color: var(--parchment);
        text-shadow: 0 1px 18px rgba(5, 7, 12, 0.85);
        opacity: 0;
        transition: opacity 1.1s ease;
      }
      #boot-cite {
        margin-top: 10px;
        font-style: normal;
        font-size: 10.5px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--parchment-dim);
        opacity: 0;
        transition: opacity 1.1s ease;
      }

      /* twelve foundation stones (Rev 21:19-20) — the progress indicator */
      #boot-passage {
        position: absolute;
        left: 50%;
        bottom: clamp(44px, 8.5vh, 84px);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      #boot-stones {
        display: flex;
        gap: clamp(8px, 1.8vw, 16px);
        padding-top: 10px;
        position: relative;
      }
      /* the wall base line the stones sit beneath: fills with progress */
      #boot-baseline {
        position: absolute;
        top: 0;
        left: 2px;
        right: 2px;
        height: 1px;
        background: rgba(217, 164, 65, 0.22);
      }
      #boot-baseline > div {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: rgba(224, 180, 92, 0.85);
        transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .stone {
        width: clamp(9px, 1.6vw, 13px);
        height: clamp(9px, 1.6vw, 13px);
        transform: rotate(45deg) scale(0.92);
        border: 1px solid rgba(216, 207, 188, 0.28);
        background: transparent;
        transition: background 0.7s ease, box-shadow 0.9s ease, border-color 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .stone.lit {
        border-color: transparent;
        transform: rotate(45deg) scale(1);
        /* per-stone color + glow set inline from the gem table */
      }
      #boot-gemname {
        margin-top: 13px;
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--gold-dim);
        min-height: 14px;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      #boot-status {
        position: absolute;
        bottom: clamp(16px, 3vh, 30px);
        left: clamp(20px, 3.2vw, 40px);
        pointer-events: none;
      }
      #boot-stage {
        font-size: 12.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--parchment-dim);
        transition: opacity 0.3s ease;
      }
      #boot-msg {
        margin-top: 6px;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: rgba(155, 145, 125, 0.42);
      }
      /* legacy hook kept for tooling familiarity; hidden bar */
      #boot-bar { display: none; }

      /* still caption, quiet, lower right */
      #boot-caption {
        position: absolute;
        bottom: clamp(16px, 3vh, 30px);
        right: clamp(20px, 3.2vw, 40px);
        font-size: 10px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(216, 207, 188, 0.5);
        text-shadow: 0 1px 12px rgba(5, 7, 12, 0.8);
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      #boot-caption.on {
        opacity: 1;
      }

      /* the arrival veil: light opens, then the world is simply there */
      #boot-veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 100% at 50% 42%,
          rgba(255, 246, 222, 0.98) 0%,
          rgba(240, 214, 150, 0.94) 45%,
          rgba(226, 180, 92, 0.9) 100%);
        opacity: 0;
        transition: opacity 0.9s ease;
        pointer-events: none;
      }
      #boot.arriving #boot-veil {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot * { transition-duration: 0.01s !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div id="boot-stills"></div>
      <div id="boot-scrim"></div>

      <div id="boot-mark">
        <div class="name">FAR&nbsp;COUNTRY</div>
        <div class="sub">The New Jerusalem</div>
      </div>

      <div id="boot-word">
        <div id="boot-verse"></div>
        <div id="boot-cite"></div>
      </div>

      <div id="boot-passage">
        <div id="boot-stones">
          <div id="boot-baseline"><div id="boot-baseline-fill"></div></div>
          <!-- twelve stones injected by BootUI -->
        </div>
        <div id="boot-gemname"></div>
      </div>

      <div id="boot-status">
        <div id="boot-stage">kindling the light</div>
        <div id="boot-msg">initializing</div>
        <div class="bar"><div id="boot-bar"></div></div>
      </div>

      <div id="boot-caption"></div>
      <div id="boot-veil"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
