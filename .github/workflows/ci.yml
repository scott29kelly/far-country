name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: pipeline (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: |
          set -o pipefail
          uv run pytest -vv --tb=long --color=no 2>&1 | tee pytest-output.txt
        env:
          PY_COLORS: "0"

      - name: Surface pytest failures as annotations
        if: failure()
        run: |
          if [ -f pytest-output.txt ]; then
            echo "::group::Full pytest output"
            cat pytest-output.txt
            echo "::endgroup::"
            grep -E "^(FAILED|ERROR) " pytest-output.txt | while read -r line; do
              echo "::error::${line}"
            done
          fi

  web:
    name: web (typecheck + tests + build + leakage check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Build (next)
        run: npm run build

      - name: No source leakage in build output
        run: npm run check:no-source-leakage

  init-db-smoke:
    name: init_db smoke
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: pipeline
        run: uv sync --extra dev

      - name: Initialize database
        working-directory: pipeline
        run: uv run python ../scripts/init_db.py

      - name: Verify database file exists
        run: test -f data/canonical.sqlite
