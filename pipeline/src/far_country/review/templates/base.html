<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Far Country Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Far Country / Review</a>
    <nav class="navlinks">
      <a href="/">Overview</a>
      <a href="/queue?status_filter=pending">Pending</a>
      <a href="/queue?status_filter=approved">Approved</a>
      <a href="/queue?status_filter=needs-discussion">Discuss</a>
      <a href="/queue?status_filter=all">All</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='keybinds.js') }}" defer></script>
</body>
</html>
